<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Content Command Center — Gullah Geechee Biz</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0f; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .container { max-width: 800px; margin: 0 auto; padding: 1rem; }
    h1 { color: #c9a84c; font-size: 1.5rem; margin-bottom: 0.5rem; }
    .subtitle { color: #666; font-size: 0.85rem; margin-bottom: 1.5rem; }
    .stats { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
    .stat-card { flex: 1; background: #1a1a2e; border-radius: 12px; padding: 1rem; text-align: center; }
    .stat-value { font-size: 1.8rem; font-weight: 700; color: #c9a84c; }
    .stat-label { font-size: 0.7rem; color: #666; margin-top: 0.25rem; }
    .next-post { background: linear-gradient(135deg, #1a1a2e, #16213e); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; border: 1px solid #c9a84c33; }
    .next-post h2 { color: #c9a84c; font-size: 1.1rem; margin-bottom: 0.75rem; }
    .script-box { background: #0a0a0f; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; font-size: 0.9rem; line-height: 1.6; color: #ccc; border: 1px solid #222; }
    .hashtags { color: #60a5fa; font-size: 0.8rem; margin-bottom: 1rem; }
    .product-link { display: inline-block; background: #c9a84c; color: #0a0a0f; padding: 0.5rem 1rem; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 0.85rem; }
    .queue { margin-bottom: 1.5rem; }
    .queue h2 { color: #c9a84c; font-size: 1.1rem; margin-bottom: 0.75rem; }
    .queue-item { background: #1a1a2e; border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; }
    .queue-item .title { font-size: 0.85rem; }
    .queue-item .status { font-size: 0.7rem; padding: 0.2rem 0.5rem; border-radius: 4px; }
    .status-ready { background: #22c55e22; color: #22c55e; }
    .status-posted { background: #666; color: #999; }
    .actions { display: flex; gap: 0.5rem; margin-top: 1rem; }
    .btn { padding: 0.5rem 1rem; border-radius: 8px; border: none; font-weight: 600; font-size: 0.8rem; cursor: pointer; }
    .btn-primary { background: #c9a84c; color: #0a0a0f; }
    .btn-secondary { background: #1a1a2e; color: #c9a84c; border: 1px solid #c9a84c; }
    .btn:hover { opacity: 0.9; }
    .footer { text-align: center; color: #444; font-size: 0.7rem; margin-top: 2rem; }
</style>
</head>
<body>
<div class="container">
    <h1>🎬 TikTok Content Command Center</h1>
    <div class="subtitle">Gullah Geechee Biz · Powered by GGB Engine</div>

    <div class="stats">
        <div class="stat-card">
            <div class="stat-value" id="statFollowers">8.5K</div>
            <div class="stat-label">Followers</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="statViews">2.8M</div>
            <div class="stat-label">Views</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="statBooks">50</div>
            <div class="stat-label">Books Ready</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="statScripts">350</div>
            <div class="stat-label">Scripts Ready</div>
        </div>
    </div>

    <div class="next-post" id="nextPost">
        <h2>📋 Next Post</h2>
        <div class="script-box" id="scriptContent">Loading next post...</div>
        <div class="hashtags" id="hashtags"></div>
        <div class="actions">
            <button class="btn btn-primary" onclick="nextPost()">🔄 Next Script</button>
            <button class="btn btn-secondary" onclick="copyScript()">📋 Copy Script</button>
        </div>
    </div>

    <div class="queue">
        <h2>📚 Posting Queue</h2>
        <div id="queueList">
            <div style="text-align:center;color:#666;padding:1rem;">Loading queue...</div>
        </div>
    </div>

    <div class="footer">
        Gullah Geechee Biz · All content generated by GGB Engine · You control when to post
    </div>
</div>

<script>
// ─── Script Bank ──────────────────────────────────────────────────────

const SCRIPTS = [
    { text: "Did you know the Gullah Geechee people have preserved African traditions for over 400 years? 📚 Our new encyclopedia volume dives deep into the culture. Link in bio!", hashtags: "#GullahGeechee #BlackHistory #BookTok #CulturalHeritage #Lowcountry" },
    { text: "Sweetgrass baskets aren't just beautiful — they're a living tradition passed down for generations. Learn the story in our latest book. 🧺✨", hashtags: "#SweetgrassBaskets #GullahGeechee #CulturalHeritage #Handmade #Lowcountry" },
    { text: "The Sea Islands hold stories that most people have never heard. We're bringing them to light, one book at a time. 🌊📖", hashtags: "#SeaIslands #GullahGeechee #History #BookTok #LowcountryLife" },
    { text: "Want to learn how to cook authentic Gullah Geechee dishes? Our cookbook series has everything from red rice to benne wafers. 🍳", hashtags: "#GullahGeechee #SoulFood #Cooking #LowcountryKitchen #FoodTok" },
    { text: "400 years of resilience. 400 years of culture. 400 years of Gullah Geechee wisdom. Now available in 50 volumes. 📚✨", hashtags: "#GullahGeechee #BlackExcellence #History #BookTok #Encyclopedia" },
    { text: "My grandmother taught me to make benne wafers when I was a kid. Now I'm sharing that recipe with the world. 🍪❤️", hashtags: "#GullahGeechee #FamilyRecipes #BenneWafers #Lowcountry #FoodTok" },
    { text: "The Gullah Geechee language is one of the most endangered in America. We're working to preserve it. 🗣️📚", hashtags: "#GullahGeechee #Language #Preservation #Culture #BookTok" },
    { text: "From West Africa to the Sea Islands — the journey of the Gullah Geechee people is a story of survival and strength. 🌍➡️🏝️", hashtags: "#GullahGeechee #AfricanDiaspora #History #SeaIslands #BookTok" },
    { text: "New book drop! 📚 Our latest encyclopedia volume is live on Google Play Books and TikTok Shop. Link in bio to grab your copy.", hashtags: "#GullahGeechee #NewBook #GooglePlayBooks #TikTokShop #BookTok" },
    { text: "The Lowcountry isn't just a place — it's a feeling. Our books capture that spirit. 🌅📖", hashtags: "#Lowcountry #GullahGeechee #SeaIslands #BookTok #SouthernLife" },
    { text: "Did you know? The word 'Gullah' may come from the Gola people of West Africa. Our encyclopedia explores these connections. 🌍📚", hashtags: "#GullahGeechee #AfricanHistory #Gola #Diaspora #BookTok" },
    { text: "Sweetgrass, praise houses, cast iron cooking — the Gullah Geechee culture is rich with tradition. Explore it all in our book series. 📚✨", hashtags: "#GullahGeechee #Traditions #Culture #Lowcountry #BookTok" },
    { text: "I spent years researching the history of the Sea Islands. Now it's all in one place — 50 volumes of Gullah Geechee wisdom. 🏝️📚", hashtags: "#GullahGeechee #SeaIslands #Research #History #BookTok" },
    { text: "Every book you buy supports Gullah Geechee cultural preservation. Thank you for being part of this mission. ❤️📚", hashtags: "#GullahGeechee #SupportBlackAuthors #CulturalPreservation #BookTok #TikTokShop" },
    { text: "The Gullah Geechee guide to finding your purpose — now available. Because your ancestors' strength lives in you. 💪📖", hashtags: "#GullahGeechee #SelfHelp #Purpose #BookTok #Motivation" },
];

// ─── State ────────────────────────────────────────────────────────────

let currentIndex = 0;
let postedCount = parseInt(localStorage.getItem('tt_posted') || '0');

function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

// Shuffle on first load
if (!localStorage.getItem('tt_shuffled')) {
    shuffleArray(SCRIPTS);
    localStorage.setItem('tt_shuffled', 'true');
}

function showPost(index) {
    const script = SCRIPTS[index % SCRIPTS.length];
    document.getElementById('scriptContent').textContent = script.text;
    document.getElementById('hashtags').textContent = script.hashtags;
}

function nextPost() {
    currentIndex = (currentIndex + 1) % SCRIPTS.length;
    showPost(currentIndex);
    updateQueue();
}

function copyScript() {
    const script = SCRIPTS[currentIndex % SCRIPTS.length];
    const text = `${script.text}\n\n${script.hashtags}`;
    navigator.clipboard.writeText(text).then(() => {
        const btn = document.querySelector('.btn-secondary');
        btn.textContent = '✅ Copied!';
        setTimeout(() => { btn.textContent = '📋 Copy Script'; }, 2000);
    });
}

function markPosted() {
    postedCount++;
    localStorage.setItem('tt_posted', postedCount.toString());
    document.getElementById('statScripts').textContent = `${SCRIPTS.length - postedCount}`;
    nextPost();
    updateQueue();
}

function updateQueue() {
    const list = document.getElementById('queueList');
    list.innerHTML = '';
    for (let i = 0; i < 10; i++) {
        const idx = (currentIndex + i + 1) % SCRIPTS.length;
        const script = SCRIPTS[idx];
        const div = document.createElement('div');
        div.className = 'queue-item';
        div.innerHTML = `
            <div class="title">${script.text.slice(0, 60)}...</div>
            <div class="status status-ready">Ready</div>
        `;
        list.appendChild(div);
    }
}

// ─── Init ────────────────────────────────────────────────────────────

showPost(currentIndex);
updateQueue();
document.getElementById('statScripts').textContent = `${SCRIPTS.length - postedCount}`;
</script>
</body>
</html>
