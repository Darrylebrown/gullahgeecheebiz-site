<!--
  Frame: clean — no decoration. Raw video edge.
  ─────────────────────────────────────────────────────────────────────
  When to use
    - Default; safest.
    - Pairs with any layout and any style.
    - Required over the `overlay` layout (decorative frames clash with full-bleed video).

  How to apply in the composition
    No extra HTML — just leave #video-wrap without the `framed` class.

    .video-wrapper { border-radius: 0; box-shadow: none; }

  How to apply on PiP layouts
    Even with `clean`, PiPs benefit from a 14px border-radius + soft shadow
    (see layouts/pip.html). That's a layout-level treatment, not a frame.

  Placement
    None. This reference exists as documentation of the "no-frame" option.
-->
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Clean Talking Head Reference Frames</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0a0c12;
        color: #fff;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      .stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        transform-origin: top left;
        transform: scale(0.5);
        background: #0a0c12;
        overflow: hidden;
      }
      .video-wrap {
        position: absolute;
        left: 240px;
        top: 140px;
        width: 1440px;
        height: 810px;
        background: #1a1f2e;
        background-image: repeating-linear-gradient(
          45deg,
          transparent 0 12px,
          rgba(255, 255, 255, 0.05) 12px 13px
        );
      }
      .v-label {
        position: absolute;
        left: 24px;
        top: 24px;
        padding: 8px 14px;
        border: 1px solid rgba(255, 255, 255, 0.45);
        border-radius: 3px;
        color: rgba(255, 255, 255, 0.7);
        font:
          600 16px/1 ui-monospace,
          monospace;
        letter-spacing: 0.14em;
      }
      .note {
        position: absolute;
        left: 240px;
        bottom: 60px;
        right: 240px;
        text-align: center;
        color: rgba(255, 255, 255, 0.5);
        font:
          14px/1.4 ui-monospace,
          monospace;
        letter-spacing: 0.12em;
      }
    </style>
    <meta name="description" content="Explore clean talking head reference frames for media and brand presentation. See more at Mega Brand Assemble & Zoom.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
  <body>
    <div class="stage">
      <div class="video-wrap">
        <span class="v-label">VIDEO · no chrome</span>
      </div>
      <div class="note">CLEAN — let the video speak for itself.</div>
