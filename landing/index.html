<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>Gullah Geechee Biz · Lowcountry Kitchen</title>
  <style>
    /* ----- RESET & BASE (fast, no frameworks) ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #faf3e6;  /* warm sand */
      font-family: Georgia, 'Times New Roman', serif;
      color: #3e2b1f;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* warm earthy palette */
    :root {
      --deep-marsh: #1f4d2e;
      --indigo-sky: #1b3b4f;
      --ochre: #b8662e;
      --sweet-potato: #c46a2b;
      --okra-green: #4e6e3e;
      --sand: #f4e4ce;
      --cream: #fff8ed;
      --night-sky: #22333b;
      --gullah-gold: #e0a458;
      --brick: #9d4e33;
    }

    h1, h2, h3 {
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem 1.2rem;
    }

    /* ----- HERO ----- */
    .hero {
      background: linear-gradient(145deg, #263f2a 0%, #143524 25%, #0f2c1c 60%, #253b27 100%);
      color: #fef7e9;
      border-bottom: 8px solid var(--gullah-gold);
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }

    .hero-inner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 2rem;
      padding: 2.5rem 0;
    }

    .hero-content {
      flex: 1 1 320px;
    }

    .hero-visual {
      flex: 1 1 240px;
      text-align: center;
    }

    .hero h1 {
      font-size: 2.2rem;
      line-height: 1.3;
      margin-bottom: 1rem;
      color: #fbeed8;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.2);
    }

    .hero p.subhead {
      font-size: 1.25rem;
      margin-bottom: 1.6rem;
      color: #f3dfc4;
      font-style: italic;
    }

    .lead-magnet-badge {
      display: inline-block;
      background: var(--gullah-gold);
      color: #1b2a1c;
      padding: 0.8rem 1.5rem;
      border-radius: 60px;
      font-weight: bold;
      font-size: 1rem;
      margin-bottom: 1.4rem;
      border: 1px solid #fae6b0;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }

    .email-capture {
      background: rgba(255,248,231,0.15);
      backdrop-filter: blur(2px);
      padding: 1rem 1rem 1.3rem;
      border-radius: 28px;
      border: 1px solid #e8c28d;
      max-width: 520px;
    }

    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .email-capture input[type="text"],
    .email-capture input[type="email"] {
      background: #fcf7e9;
      border: 1px solid #c6a15b;
      padding: 0.8rem 0.9rem;
      border-radius: 60px;
      font-size: 1rem;
      width: 100%;
      font-family: inherit;
      color: #1f2e1f;
    }

    .email-capture input:focus {
      outline: 2px solid #f3c488;
      background: #ffffff;
    }

    .btn {
      background: var(--ochre);
      padding: 0.8rem 1.6rem;
      border: none;
      border-radius: 60px;
      font-size: 1rem;
      font-weight: bold;
      color: #151f14;
      background: linear-gradient(145deg, #d99b4e, #b8662e);
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.1s ease;
      font-family: inherit;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }

    .btn:hover {
      background: #cf8f48;
      transform: scale(1.02);
    }

    .btn-wider {
      padding-left: 2rem;
      padding-right: 2rem;
    }

    .fine-print {
      font-size: 0.8rem;
      opacity: 0.9;
      margin-top: 0.7rem;
    }

    /* nature imagery (CSS / leaf motif) */
    .hero-visual .nature-symbol {
      font-size: 6rem;
      line-height: 1;
      color: #eab670;
      text-shadow: 0 0 18px #67a35c;
      position: relative;
      display: inline-block;
    }

    .hero-visual span {
      font-size: 2.8rem;
      display: block;
      color: #f2cca2;
    }

    /* ----- section standard ----- */
    .section {
      padding: 3rem 0;
    }

    .section-title {
      font-size: 2rem;
      margin-bottom: 1.5rem;
      border-left: 6px solid var(--brick);
      padding-left: 1.2rem;
      color: #2f3c24;
    }

    /* featured products cards */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 2rem;
      margin-top: 1.8rem;
    }

    .product-card {
      background: var(--cream);
      border-radius: 30px 30px 30px 12px;
      overflow: hidden;
      box-shadow: 0 10px 18px rgba(42, 43, 25, 0.1);
      border: 1px solid #dfcfb2;
      transition: box-shadow 0.2s ease;
    }

    .product-card:hover {
      box-shadow: 0 16px 24px rgba(58, 54, 30, 0.25);
    }

    .product-image {
      background-color: #a4b689;
      height: 160px;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40"><path d="M12 8 L22 2 L32 8 L30 20 L22 28 L12 24 L6 14 Z" fill="%233b5a2f" opacity="0.4"/><circle cx="20" cy="14" r="5" fill="%23e2b15a" opacity="0.5"/></svg>');
      background-repeat: repeat;
      background-blend-mode: overlay;
      background-size: 40px;
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      padding: 0.8rem;
    }

    .product-card .card-content {
      padding: 1.3rem 1.2rem 1.5rem;
    }

    .product-card h3 {
      font-size: 1.4rem;
      color: #1f3d24;
      margin-bottom: 0.5rem;
      border-bottom: 1px dotted #b8a684;
      padding-bottom: 0.25rem;
    }

    .product-badge {
      background: #222e1d;
      color: #fbebd0;
      padding: 0.4rem 1rem;
      border-radius: 40px;
      font-size: 0.9rem;
      display: inline-block;
      background: #315f35;
    }

    .price-style {
      font-weight: normal;
      color: #7d3f1a;
    }

    /* testimonial */
    .testimonial-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      justify-content: center;
      margin: 2rem 0;
    }

    .testimonial-item {
      background: #e8d6ba;
      border-radius: 40px 12px 40px 12px;
      padding: 2rem 1.5rem;
      flex: 1 1 280px;
      box-shadow: 3px 10px 20px rgba(98, 67, 24, 0.1);
      border: 1px solid #eec796;
    }

    .testimonial-item p {
      font-size: 1.1rem;
      margin-bottom: 0.8rem;
    }

    .testimonial-attribute {
      font-style: italic;
      font-weight: bold;
      color: #4a3824;
    }

    .nature-rule {
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 10" width="20" height="10"><path d="M0 5 Q2 2 5 5 T10 5 T15 5 T20 5" stroke="%23b5823c" fill="none" stroke-width="1.5"/></svg>') repeat-x;
      height: 12px;
      opacity: 0.6;
      margin: 1rem 0;
    }

    /* footer (simple) */
    .footer {
      background: #2d3527;
      color: #ecd9b3;
      text-align: center;
      padding: 2rem 1rem;
      margin-top: auto;
      border-top: 4px solid var(--gullah-gold);
    }

    small {
      opacity: 0.8;
    }

    /* micro responsiveness */
    @media (max-width: 680px) {
      .hero h1 {
        font-size: 1.8rem;
      }
      .section-title {
        font-size: 1.6rem;
      }
      .email-capture .form-row {
        flex-direction: column;
      }
      .btn-wider {
        width: 100%;
        text-align: center;
      }
      .email-capture input {
        width: 100%;
      }
    }
  </style>
</head>
