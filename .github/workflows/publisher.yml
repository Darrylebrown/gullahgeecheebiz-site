name: CI

# No paths filter. The site suite is a gate for the whole repository, and a filter that
# scoped this workflow to ggb-engine/ meant `npm test` was not run for site changes at
# all — the publisher branch quietly became the only thing CI checked.
on:
  push:
    branches: [main, 'repair/**']
  pull_request:

permissions:
  contents: read

jobs:
  publisher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r ggb-engine/requirements-dev.txt

      # Both runners must agree. A suite that is green under one and red under the
      # other is how a broken build previously reported success.
      - name: pytest
        run: python -m pytest ggb-engine/tests/test_publisher.py -q
      - name: direct runner
        run: python ggb-engine/tests/run_tests.py

      - name: mutation testing
        run: python ggb-engine/tests/mutation_test.py

      # Walks every .py under ggb-engine/ and names its exceptions, rather than
      # searching two paths and claiming to have checked the engine.
      - name: no unallowlisted network access
        run: python ggb-engine/tests/network_scan.py

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: smoke tests
        run: npm test

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pinned to the commit behind v3.96.0. @main on a secret scanner means an
      # unreviewed third party can change what runs against the full history.
      #
      # `version` matters as much as the commit pin: the action is a thin wrapper that
      # docker-runs ghcr.io/trufflesecurity/trufflehog:${version}, which defaults to
      # `latest`. Pinning only the action pins the shell script and leaves the scanner
      # itself floating.
      #
      # --fail is NOT passed here. The action's own command line already includes it, and
      # a second one makes the CLI exit 1 with "flag 'fail' cannot be repeated" before it
      # scans anything — a secret-scanning job that fails for a reason unrelated to secrets
      # and would keep failing identically if a real one were committed.
      - uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          version: v3.96.0
          extra_args: --results=verified,unknown
