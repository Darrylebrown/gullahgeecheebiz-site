name: Publisher Control Plane

on:
  pull_request:
    paths:
      - 'ggb-engine/**'
  push:
    branches: [p0-corrections]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r ggb-engine/requirements.txt
      - name: Run publisher tests
        run: python3 ggb-engine/tests/test_publisher.py
      - name: Run pytest
        run: python3 -m pytest ggb-engine/tests -v
      - name: Run site smoke tests
        run: npm test
      - name: Secret scan
        run: |
          python3 -m pip install truffleHog
          trufflehog filesystem --directory . --max_depth 3 2>/dev/null || true
